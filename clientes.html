<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área de Clientes | ECO do B.E.M.</title>
  <meta name="description" content="Portal de acesso dos clientes ECO do B.E.M." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--deep:#1A0A5E;--eco:#5B2EFF;--purple2:#7044FF;--card:#3A2D6B;--teal:#00B8D9;--gold:#F59E0B;--lilac:#C4B8FF;--white:#fff;--black:#0D0D14}
    body{min-height:100vh;font-family:Poppins,sans-serif;color:#fff;background:var(--deep);display:flex;flex-direction:column;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 10% 18%,rgba(91,46,255,.24),transparent 60%),radial-gradient(ellipse 70% 55% at 95% 82%,rgba(0,184,217,.14),transparent 55%),linear-gradient(180deg,rgba(13,13,20,0),rgba(13,13,20,.22))}
    a{color:inherit;text-decoration:none}.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}.container{width:min(1120px,calc(100% - 48px));margin:0 auto}
    header{border-bottom:1px solid rgba(0,184,217,.14);background:rgba(26,10,94,.82);backdrop-filter:blur(18px)}.header-inner{height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{display:flex;align-items:center;gap:13px}.logo-mark{width:42px;height:42px;border-radius:16px;background:linear-gradient(135deg,var(--eco),var(--teal));display:grid;place-items:center;font-weight:900;box-shadow:0 14px 32px rgba(0,184,217,.18)}.logo-text{display:flex;flex-direction:column;line-height:1}.logo-text strong{font-size:18px;font-weight:900;letter-spacing:-.04em}.logo-text span{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--teal)}.back{font-size:13px;font-weight:700;color:var(--lilac);transition:.2s}.back:hover{color:var(--teal)}
    .hero{text-align:center;padding:72px 0 48px}.eyebrow{display:inline-block;color:var(--teal);font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px}.hero h1{font-size:clamp(38px,6vw,68px);font-weight:900;line-height:1.02;letter-spacing:-.055em}.hero-line{display:block;width:64px;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:3px;margin:24px auto 20px}.hero p{max-width:560px;margin:0 auto;color:var(--lilac);font-size:15px;line-height:1.7}
    .clientes-section{flex:1;padding:0 0 80px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.client-card{position:relative;overflow:hidden;text-align:left;color:#fff;width:100%;cursor:pointer;background:linear-gradient(145deg,rgba(58,45,107,.98),rgba(45,29,111,.94));border:1px solid rgba(255,255,255,.10);border-top:3px solid var(--teal);border-radius:22px;padding:34px 30px 30px;box-shadow:0 24px 58px rgba(0,0,0,.22);transition:.25s;font-family:Poppins,sans-serif}.client-card:hover{transform:translateY(-5px);box-shadow:0 34px 78px rgba(0,0,0,.34);border-color:rgba(0,184,217,.36)}.client-card::before{content:"";position:absolute;top:-58px;right:-58px;width:164px;height:164px;border-radius:50%;background:radial-gradient(circle,rgba(0,184,217,.15),transparent 68%)}.client-card h2{position:relative;z-index:1;font-size:clamp(25px,3vw,36px);line-height:1.02;font-weight:900;letter-spacing:-.045em;text-transform:uppercase}.detail{position:relative;z-index:1;margin-top:9px;color:rgba(196,184,255,.58);font-size:11px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;line-height:1.45}.divider{position:relative;z-index:1;width:46px;height:2px;background:var(--teal);border-radius:2px;margin:22px 0}.card-cta{position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px;color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}.client-card:hover .card-cta{color:#fff}
    .access-panel{display:none;margin-top:30px;background:linear-gradient(145deg,rgba(58,45,107,.98),rgba(26,10,94,.96));border:1px solid rgba(255,255,255,.12);border-top:3px solid var(--gold);border-radius:24px;padding:30px;box-shadow:0 28px 70px rgba(0,0,0,.30)}.access-panel.open{display:block}.panel-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.panel-title h2{font-size:clamp(26px,4vw,44px);line-height:1;font-weight:900;letter-spacing:-.05em;text-transform:uppercase}.panel-title p{margin-top:10px;color:var(--lilac);font-size:14px;line-height:1.6}.panel-back{border:1px solid rgba(0,184,217,.7);background:rgba(0,184,217,.07);color:var(--teal);border-radius:999px;padding:10px 15px;font-family:Poppins,sans-serif;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}.buttons{display:flex;flex-direction:column;gap:11px}.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:14px 17px 14px 19px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.25px;text-transform:uppercase;transition:.2s}.btn:hover{transform:translateX(4px)}.btn-outline{border:1.5px solid rgba(0,184,217,.95);color:var(--teal);background:rgba(0,184,217,.03)}.btn-solid{border:1.5px solid var(--teal);background:linear-gradient(135deg,var(--teal),#00d4f5);color:var(--deep);box-shadow:0 12px 26px rgba(0,184,217,.22)}.btn-gold{border:1.5px solid var(--gold);color:var(--gold);background:rgba(245,158,11,.04)}
    footer{border-top:1px solid rgba(0,184,217,.11);padding:28px 0;text-align:center;color:rgba(196,184,255,.55)}.footer-line{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700}.footer-line strong{color:var(--teal)}.footer-line a{color:var(--gold)}.tagline{display:block;margin-top:7px;font-size:10px;font-style:italic;color:rgba(196,184,255,.38)}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.header-inner{height:auto;padding:20px 0;align-items:flex-start;flex-direction:column}.hero{padding:54px 0 40px}.container{width:min(100% - 32px,1120px)}.panel-top{flex-direction:column}.panel-back{width:100%}}
    @media(max-width:480px){.client-card,.access-panel{padding:26px 22px}.btn{font-size:12px}.hero h1{font-size:38px}}
  </style>
</head>
<body>
  <div class="page">
    <header><div class="container header-inner"><a href="/" class="logo"><span class="logo-mark">E</span><span class="logo-text"><strong>ECO do B.E.M.</strong><span>ecodobem.com</span></span></a><a class="back" href="/">Voltar ao site</a></div></header>
    <main>
      <section class="hero container"><span class="eyebrow">Portal reservado</span><h1>Área de Clientes</h1><span class="hero-line"></span><p>Selecione sua organização para visualizar os acessos disponíveis. Os links das plataformas ficam protegidos até a escolha do cliente.</p></section>
      <section class="clientes-section"><div class="container"><div class="grid" id="grid"></div><div class="access-panel" id="accessPanel"></div></div></section>
    </main>
    <footer><div class="footer-line"><strong>@ecodobemoficial</strong><span>·</span><a href="/">ecodobem.com</a></div><span class="tagline">Lideranças melhores. Equipes mais fortes.</span></footer>
  </div>
  <script>
    const clientes=[
      {id:'banrisul',nome:'Banrisul',detalhe:'Acesso reservado',descricao:'Ambientes disponíveis para o programa Banrisul.',botoes:[{label:'Processo Seletivo',url:'https://ecolider.ecodobem.com/Banrisul',estilo:'outline'},{label:'Desenvolvimento de Líderes',url:'https://ecolider.ecodobem.com/',estilo:'solid'}]},
      {id:'sebrae-acre',nome:'SEBRAE Acre',detalhe:'Acesso reservado',descricao:'Ambientes disponíveis para o ecossistema SEBRAE Acre.',botoes:[{label:'ECO Líderes',url:'https://ecolider.ecodobem.com/SEBRAE%20Acre',estilo:'outline'},{label:'Banco de Sucessores',url:'https://ecolider.ecodobem.com/SEBRAE%20Acre',estilo:'outline'},{label:'Plataforma PDI Evoluir',url:'https://pdi.ecodobem.com/login',estilo:'solid'}]},
      {id:'sebrae-to',nome:'SEBRAE Tocantins',detalhe:'Acesso reservado',descricao:'Ambientes disponíveis para o ecossistema SEBRAE Tocantins.',botoes:[{label:'ECO Líderes',url:'https://ecolider.ecodobem.com/SEBRAE%20Tocantins',estilo:'outline'},{label:'Levantamento de Aderência',url:'https://aderencia.ecodobem.com/login',estilo:'solid'}]},
      {id:'embrapii',nome:'EMBRAPII',detalhe:'Acesso reservado',descricao:'Ambiente disponível para o programa EMBRAPII.',botoes:[{label:'ECO Líderes',url:'https://ecolider.ecodobem.com/',estilo:'solid'}]}
    ];
    const grid=document.getElementById('grid');
    const panel=document.getElementById('accessPanel');
    function showClient(cliente){
      panel.classList.add('open');
      panel.innerHTML=`<div class="panel-top"><div class="panel-title"><h2>${cliente.nome}</h2><p>${cliente.descricao}</p></div><button class="panel-back" type="button" onclick="hidePanel()">Voltar aos clientes</button></div><div class="buttons">${cliente.botoes.map(b=>`<a class="btn btn-${b.estilo}" href="${b.url}" target="_blank" rel="noopener noreferrer"><span>${b.label}</span><span>→</span></a>`).join('')}</div>`;
      panel.scrollIntoView({behavior:'smooth',block:'start'});
    }
    function hidePanel(){panel.classList.remove('open');panel.innerHTML='';document.querySelector('.clientes-section').scrollIntoView({behavior:'smooth',block:'start'});}
    clientes.forEach(c=>{const card=document.createElement('button');card.type='button';card.className='client-card';card.innerHTML=`<h2>${c.nome}</h2><div class="detail">${c.detalhe}</div><div class="divider"></div><span class="card-cta">Acessar área <span>→</span></span>`;card.addEventListener('click',()=>showClient(c));grid.appendChild(card)});
  </script>
</body>
</html>
