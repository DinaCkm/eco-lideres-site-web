    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Poppins',sans-serif;color:#fff;background:radial-gradient(circle at 18% 12%,rgba(0,184,217,.28),transparent 32%),radial-gradient(circle at 86% 22%,rgba(112,68,255,.35),transparent 34%),linear-gradient(145deg,var(--deep),#130743 56%,var(--black));overflow-x:hidden}body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 50% 35%,#000 0%,transparent 76%);-webkit-mask-image:radial-gradient(circle at 50% 35%,#000 0%,transparent 76%)}a{color:inherit;text-decoration:none}.page{position:relative;z-index:1;width:min(960px,calc(100% - 40px));margin:0 auto;min-height:100vh;padding:34px 0;display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:56px}.brand{font-weight:900;font-size:22px;letter-spacing:-.04em}.back{font-size:13px;color:var(--lilac);font-weight:700;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 16px;background:rgba(255,255,255,.05);transition:.2s}.back:hover{background:rgba(0,184,217,.13);color:#fff}.shell{background:linear-gradient(150deg,rgba(58,45,107,.96),rgba(26,10,94,.88));border:1px solid rgba(255,255,255,.14);border-radius:34px;box-shadow:0 34px 100px rgba(0,0,0,.35);overflow:hidden}.shell::before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--teal),var(--purple2),var(--gold))}.content{padding:clamp(28px,5vw,56px)}.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--teal);font-size:12px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:18px}.eyebrow::before{content:"";width:34px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--gold))}h1{margin:0;font-size:clamp(2.5rem,8vw,5.6rem);line-height:.9;letter-spacing:-.075em;font-weight:900;text-transform:uppercase}.rule{width:72px;height:4px;border-radius:99px;background:var(--teal);margin:26px 0 18px}.subtitle{margin:0 0 34px;color:var(--lilac);line-height:1.72;font-size:1rem;max-width:660px;font-weight:500}.access-list{display:grid;gap:18px}.access-card{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;min-height:92px;padding:20px 22px;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,rgba(91,46,255,.98),rgba(0,184,217,.86));box-shadow:0 24px 60px rgba(0,184,217,.14);border:1px solid rgba(255,255,255,.16);transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease}.access-card:nth-child(2){background:linear-gradient(135deg,rgba(0,184,217,.92),rgba(112,68,255,.92));box-shadow:0 24px 60px rgba(91,46,255,.18)}.access-card::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0%,rgba(255,255,255,.18) 42%,transparent 62%);transform:translateX(-120%);transition:transform .55s ease}.access-card:hover{transform:translateY(-5px);box-shadow:0 34px 80px rgba(0,0,0,.32);border-color:rgba(255,255,255,.34)}.access-card:hover::before{transform:translateX(120%)}.icon{position:relative;z-index:1;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);font-size:22px}.label{position:relative;z-index:1;font-size:clamp(1rem,2.4vw,1.25rem);font-weight:800;letter-spacing:-.025em}.arrow{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:24px;font-weight:800}footer{margin-top:auto;padding-top:24px;color:var(--lilac);font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}footer strong{color:var(--gold)}@media(max-width:620px){.page{width:min(100% - 28px,960px);padding-top:22px}.topbar{
