<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagamento não concluído | ECO do B.E.M.</title>
<meta name="robots" content="noindex">
<script>
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  const destino = ref
    ? 'pagamento-recusado.html?ref=' + encodeURIComponent(ref) + '&motivo=checkout_nao_concluido'
    : 'pagamento-recusado.html?motivo=checkout_nao_concluido';
  window.location.replace(destino);
</script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #F5F3FF;
    color: #1A0A5E;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box {
    max-width: 520px;
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 18px 50px rgba(26,10,94,.12);
  }
  h1 { margin: 0 0 12px; font-size: 24px; }
  p { color: #3A3559; line-height: 1.5; }
  a { color: #5B2EFF; font-weight: 700; }
</style>
</head>
<body>
  <div class="box">
    <h1>Redirecionando...</h1>
    <p>Seu pagamento não foi concluído. Você será levado para a página correta.</p>
    <p><a href="pagamento-recusado.html?motivo=checkout_nao_concluido">Clique aqui se não for redirecionado automaticamente.</a></p>
  </div>
</body>
</html>
