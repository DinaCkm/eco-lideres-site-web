<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área de Clientes | ECO do B.E.M.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Poppins,sans-serif;color:#fff;background:#1A0A5E;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 15% 12%,rgba(91,46,255,.24),transparent 52%),radial-gradient(ellipse at 85% 84%,rgba(0,184,217,.14),transparent 55%),linear-gradient(180deg,rgba(13,13,20,0),rgba(13,13,20,.22));pointer-events:none}.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}.container{width:min(1040px,calc(100% - 40px));margin:auto}header{border-bottom:1px solid rgba(0,184,217,.14);background:rgba(26,10,94,.84);backdrop-filter:blur(18px)}.head{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand img{height:38px;width:auto;display:block}.brand-fallback{font-size:17px;font-weight:800;letter-spacing:-.03em}.back{color:#C4B8FF;text-decoration:none;font-size:13px;font-weight:500}.hero{text-align:center;padding:58px 0 36px}.eyebrow{color:#00B8D9;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.03;font-weight:900;letter-spacing:-.055em;margin-top:16px}.line{width:54px;height:3px;margin:20px auto 17px;border-radius:3px;background:linear-gradient(90deg,#F59E0B,#00B8D9)}.hero p{max-width:520px;margin:auto;color:#C4B8FF;font-size:14px;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:0 0 64px}.card{position:relative;overflow:hidden;width:100%;min-height:150px;text-align:left;cursor:pointer;color:#fff;font-family:Poppins,sans-serif;background:linear-gradient(145deg,rgba(50,37,96,.96),rgba(35,22,88,.94));border:1px solid rgba(255,255,255,.10);border-top:2px solid #00B8D9;border-radius:18px;padding:25px 24px 22px;box-shadow:0 18px 42px rgba(0,0,0,.20);transition:.25s}.card:hover{transform:translateY(-3px);box-shadow:0 26px 56px rgba(0,0,0,.30);border-color:rgba(0,184,217,.28)}.card:before{content:"";position:absolute;top:-52px;right:-52px;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(0,184,217,.14),transparent 68%)}.card h2{position:relative;font-size:clamp(21px,2.4vw,29px);line-height:1.03;font-weight:750;letter-spacing:-.04em;text-transform:uppercase}.divider{position:relative;width:38px;height:2px;background:#00B8D9;border-radius:2px;margin:18px 0}.cta{position:relative;color:#8FEFFF;font-size:11px;font-weight:600;letter-spacing:.65px;text-transform:uppercase}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(13,13,20,.64);backdrop-filter:blur(10px)}.overlay.open{display:flex}.modal{width:min(600px,100%);max-height:calc(100vh - 56px);overflow:auto;background:linear-gradient(145deg,rgba(50,37,96,.99),rgba(26,10,94,.98));border:1px solid rgba(255,255,255,.14);border-top:3px solid #F59E0B;border-radius:24px;padding:28px;box-shadow:0 34px 90px rgba(0,0,0,.46)}.modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.modal h2{font-size:clamp(25px,4vw,38px);font-weight:800;letter-spacing:-.045em;text-transform:uppercase;line-height:1}.modal p{margin-top:10px;color:#C4B8FF;font-size:14px;line-height:1.6}.close{width:38px;height:38px;border-radius:999px;border:1px solid rgba(196,184,255,.28);background:rgba(255,255,255,.06);color:#fff;font-size:20px;line-height:1;cursor:pointer}.buttons{display:flex;flex-direction:column;gap:10px}.btn{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:13px 16px;border-radius:13px;font-size:13px;font-weight:500;letter-spacing:.1px;text-decoration:none;transition:.2s}.btn:hover{transform:translateX(3px)}.outline{border:1px solid rgba(0,184,217,.62);color:#E9FBFF;background:rgba(0,184,217,.07)}.solid{border:1px solid rgba(0,184,217,.86);background:linear-gradient(135deg,#00B8D9,#00d4f5);color:#1A0A5E}.arrow{font-weight:700;color:inherit;opacity:.75}footer{border-top:1px solid rgba(0,184,217,.11);padding:24px 0;text-align:center;color:rgba(196,184,255,.55);font-size:12px;font-weight:500}footer strong{color:#00B8D9}@media(max-width:820px){.grid{grid-template-columns:1fr}.head{height:auto;padding:18px 0;align-items:flex-start;flex-direction:column}.hero{padding:48px 0 34px}.modal{padding:24px 20px}.modal-top{gap:12px}.brand img{height:36px}.card{min-height:132px}}
</style>
</head>
<body><div class="wrap"><header><div class="container head"><a class="brand" href="/"><img src="img/logo-branco.png" alt="ECO do B.E.M." onerror="this.outerHTML='<span class=&quot;brand-fallback&quot;>ECO do B.E.M.</span>'"></a><a class="back" href="/">Voltar ao site</a></div></header><main class="container"><section class="hero"><div class="eyebrow">Portal reservado</div><h1>Área de Clientes</h1><div class="line"></div><p>Selecione sua organização para visualizar os acessos disponíveis.</p></section><section><div class="grid" id="grid"></div></section></main><footer><strong>@ecodobemoficial</strong> · ECO do B.E.M.</footer></div><div class="overlay" id="overlay" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><div><h2 id="modalTitle"></h2><p id="modalDesc"></p></div><button class="close" type="button" aria-label="Fechar" onclick="closeClient()">×</button></div><div class="buttons" id="modalButtons"></div></div></div>
<script>
const ECO='https://ecolider.ecodobem.com/';
const data=[
{n:'Banrisul',d:'Ambientes disponíveis para o programa Banrisul.',b:[['Processo Seletivo',ECO,'outline'],['Desenvolvimento de Líderes',ECO,'solid']]},
{n:'SEBRAE Acre',d:'Ambiente disponível para o ecossistema SEBRAE Acre.',b:[['ECO Líderes',ECO,'solid']]},
{n:'SEBRAE Tocantins',d:'Ambientes disponíveis para o ecossistema SEBRAE Tocantins.',b:[['ECO Líderes',ECO,'outline'],['Banco de Sucessores',ECO,'outline'],['Plataforma PDI Evoluir','https://pdi.ecodobem.com/login','solid'],['Levantamento de Aderência','https://aderencia.ecodobem.com/login','outline']]},
{n:'EMBRAPII',d:'Ambiente disponível para o programa EMBRAPII.',b:[['ECO Líderes',ECO,'solid']]}
];
const grid=document.getElementById('grid'),overlay=document.getElementById('overlay'),title=document.getElementById('modalTitle'),desc=document.getElementById('modalDesc'),buttons=document.getElementById('modalButtons');
function openClient(c){title.textContent=c.n;desc.textContent=c.d;buttons.innerHTML=c.b.map(x=>'<a class="btn '+x[2]+'" href="'+x[1]+'" target="_blank" rel="noopener noreferrer"><span>'+x[0]+'</span><span class="arrow">→</span></a>').join('');overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeClient(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow=''}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeClient()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeClient()});
data.forEach(c=>{let el=document.createElement('button');el.className='card';el.type='button';el.innerHTML='<h2>'+c.n+'</h2><div class="divider"></div><div class="cta">Acessar área →</div>';el.onclick=()=>openClient(c);grid.appendChild(el);});
</script></body></html>
