<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área de Clientes | ECO do B.E.M.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Poppins,sans-serif;color:#fff;background:#1A0A5E}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 12% 18%,rgba(91,46,255,.28),transparent 55%),radial-gradient(ellipse at 88% 82%,rgba(0,184,217,.16),transparent 55%);pointer-events:none}.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}.container{width:min(1120px,calc(100% - 40px));margin:auto}header{border-bottom:1px solid rgba(0,184,217,.16);background:rgba(26,10,94,.86)}.head{height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}.mark{width:42px;height:42px;border-radius:15px;background:linear-gradient(135deg,#5B2EFF,#00B8D9);display:grid;place-items:center;font-weight:900}.brand strong{display:block;font-size:18px;font-weight:900;letter-spacing:-.04em}.brand span{display:block;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#00B8D9}.back{color:#C4B8FF;text-decoration:none;font-size:13px;font-weight:700}.hero{text-align:center;padding:70px 0 46px}.eyebrow{color:#00B8D9;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase}.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.02;font-weight:900;letter-spacing:-.055em;margin-top:18px}.line{width:64px;height:3px;margin:24px auto 20px;border-radius:3px;background:linear-gradient(90deg,#F59E0B,#00B8D9)}.hero p{max-width:560px;margin:auto;color:#C4B8FF;font-size:15px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding-bottom:80px}.card{position:relative;overflow:hidden;width:100%;text-align:left;cursor:pointer;color:#fff;font-family:Poppins,sans-serif;background:linear-gradient(145deg,rgba(58,45,107,.98),rgba(45,29,111,.94));border:1px solid rgba(255,255,255,.10);border-top:3px solid #00B8D9;border-radius:22px;padding:34px 30px 30px;box-shadow:0 24px 58px rgba(0,0,0,.22);transition:.25s}.card:hover{transform:translateY(-5px);box-shadow:0 34px 78px rgba(0,0,0,.34)}.card:before{content:"";position:absolute;top:-58px;right:-58px;width:164px;height:164px;border-radius:50%;background:radial-gradient(circle,rgba(0,184,217,.15),transparent 68%)}.card h2{position:relative;font-size:clamp(25px,3vw,36px);line-height:1.02;font-weight:900;letter-spacing:-.045em;text-transform:uppercase}.detail{position:relative;margin-top:9px;color:rgba(196,184,255,.58);font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}.divider{position:relative;width:46px;height:2px;background:#00B8D9;border-radius:2px;margin:22px 0}.cta{position:relative;color:#00B8D9;font-size:12px;font-weight:900;letter-spacing:.7px;text-transform:uppercase}.panel{display:none;margin:0 0 80px;background:linear-gradient(145deg,rgba(58,45,107,.98),rgba(26,10,94,.96));border:1px solid rgba(255,255,255,.12);border-top:3px solid #F59E0B;border-radius:24px;padding:30px;box-shadow:0 28px 70px rgba(0,0,0,.30)}.panel.open{display:block}.panel-top{display:flex;justify-content:space-between;gap:18px;margin-bottom:22px}.panel h2{font-size:clamp(26px,4vw,44px);font-weight:900;letter-spacing:-.05em;text-transform:uppercase}.panel p{margin-top:10px;color:#C4B8FF;font-size:14px;line-height:1.6}.panel button{border:1px solid rgba(0,184,217,.7);background:rgba(0,184,217,.07);color:#00B8D9;border-radius:999px;padding:10px 15px;font-family:Poppins,sans-serif;font-size:12px;font-weight:900;cursor:pointer}.buttons{display:flex;flex-direction:column;gap:11px}.btn{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:14px 18px;border-radius:12px;font-size:13px;font-weight:900;letter-spacing:.25px;text-transform:uppercase;text-decoration:none}.outline{border:1.5px solid #00B8D9;color:#00B8D9}.solid{border:1.5px solid #00B8D9;background:linear-gradient(135deg,#00B8D9,#00d4f5);color:#1A0A5E}footer{border-top:1px solid rgba(0,184,217,.12);padding:28px 0;text-align:center;color:rgba(196,184,255,.55);font-size:12px;font-weight:700}footer strong{color:#00B8D9}@media(max-width:820px){.grid{grid-template-columns:1fr}.head{height:auto;padding:20px 0;align-items:flex-start;flex-direction:column}.hero{padding:54px 0 40px}.panel-top{flex-direction:column}.panel button{width:100%}}
</style>
</head>
<body><div class="wrap"><header><div class="container head"><a class="brand" href="/"><div class="mark">E</div><div><strong>ECO do B.E.M.</strong><span>área de clientes</span></div></a><a class="back" href="/">Voltar ao site</a></div></header><main class="container"><section class="hero"><div class="eyebrow">Portal reservado</div><h1>Área de Clientes</h1><div class="line"></div><p>Selecione sua organização para visualizar os acessos disponíveis.</p></section><section><div class="grid" id="grid"></div><div class="panel" id="panel"></div></section></main><footer><strong>@ecodobemoficial</strong> · ECO do B.E.M.</footer></div>
<script>
const data=[
{n:'Banrisul',d:'Ambientes disponíveis para o programa Banrisul.',b:[['Processo Seletivo','https://ecolider.ecodobem.com/Banrisul','outline'],['Desenvolvimento de Líderes','https://ecolider.ecodobem.com/','solid']]},
{n:'SEBRAE Acre',d:'Ambientes disponíveis para o ecossistema SEBRAE Acre.',b:[['ECO Líderes','https://ecolider.ecodobem.com/SEBRAE%20Acre','outline'],['Banco de Sucessores','https://ecolider.ecodobem.com/SEBRAE%20Acre','outline'],['Plataforma PDI Evoluir','https://pdi.ecodobem.com/login','solid']]},
{n:'SEBRAE Tocantins',d:'Ambientes disponíveis para o ecossistema SEBRAE Tocantins.',b:[['ECO Líderes','https://ecolider.ecodobem.com/SEBRAE%20Tocantins','outline'],['Levantamento de Aderência','https://aderencia.ecodobem.com/login','solid']]},
{n:'EMBRAPII',d:'Ambiente disponível para o programa EMBRAPII.',b:[['ECO Líderes','https://ecolider.ecodobem.com/','solid']]}
];
const grid=document.getElementById('grid'),panel=document.getElementById('panel');
function openClient(c){panel.className='panel open';panel.innerHTML='<div class="panel-top"><div><h2>'+c.n+'</h2><p>'+c.d+'</p></div><button onclick="closeClient()">Voltar aos clientes</button></div><div class="buttons">'+c.b.map(x=>'<a class="btn '+x[2]+'" href="'+x[1]+'" target="_blank" rel="noopener noreferrer"><span>'+x[0]+'</span><span>→</span></a>').join('')+'</div>';panel.scrollIntoView({behavior:'smooth',block:'start'});}function closeClient(){panel.className='panel';panel.innerHTML='';}
data.forEach(c=>{let el=document.createElement('button');el.className='card';el.innerHTML='<h2>'+c.n+'</h2><div class="detail">Acesso reservado</div><div class="divider"></div><div class="cta">Acessar área →</div>';el.onclick=()=>openClient(c);grid.appendChild(el);});
</script></body></html>
